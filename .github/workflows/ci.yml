name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q --cov=app --cov-report=term-missing
        env:
          APP_ENV: testing

  postgres-smoke:
    # The unit tests run on SQLite. This job makes sure the pgvector and
    # full text search code paths work against a real Postgres.
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: studymate
          POSTGRES_PASSWORD: studymate
          POSTGRES_DB: studymate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studymate" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://studymate:studymate@localhost:5432/studymate
      REDIS_URL: redis://localhost:6379/0
      INGEST_ASYNC: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: flask --app wsgi init-db
      - run: python scripts/seed_demo.py
      - run: python scripts/smoke_test.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t studymate:ci .
