upstream studymate_api {
    server api:8000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 26m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health/live {
        proxy_pass http://studymate_api;
        access_log off;
    }

    # Streaming answers: no buffering, long read timeout, keep the connection open.
    location ~ ^/api/sessions/\d+/stream$ {
        proxy_pass http://studymate_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        limit_req zone=per_ip burst=60 nodelay;
        proxy_pass http://studymate_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://studymate_api;
    }
}
